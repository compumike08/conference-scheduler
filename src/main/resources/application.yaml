spring:
  application:
    name: conference-scheduler
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSZ
  web:
    error:
      include-message: always
jwt:
  rsa:
    public-key: "${CONFERENCE_SCHDLR_APP_JWT_RSA_PUBLIC_KEY}"
    private-key: "${CONFERENCE_SCHDLR_APP_JWT_RSA_PRIVATE_KEY}"
  issuer: conference-scheduler
  expiration-minutes: 15
  refresh-token:
    expiration-days: 1

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:file:./data/testdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  flyway:
    enabled: false
  sql:
    init:
      mode: always
logging:
  level:
    mh.michael.*: DEBUG
